# ===================================================================
# CONFIGURACOES DA APLICACAO
# ===================================================================
spring.application.name=springAlura
spring.messages.encoding=UTF-8
# ===================================================================
# CONFIGURACOES DO BANCO DE DADOS (POSTGRESQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=spring_alura&charSet=UTF-8
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# ===================================================================
# CONFIGURACOES DO JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ===================================================================
# CONFIGURACOES DO JACKSON (SERIALIZACAO JSON)
# ===================================================================
spring.jackson.mapper.accept-case-insensitive-properties=true
#spring.jackson.serialization.write-dates-as-timestamps=false
# ===================================================================
# CONFIGURACOES DO SWAGGER UI (SPRINGDOC)
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.paths-to-exclude=/error, /api/profile**, /api/profile/**
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.displayRequestDuration=true

# ===================================================================
# VARIAVEIS PERSONALIZADAS (APIS EXTERNAS)
# ===================================================================
#VARIAVEIS HIBERNATE ENVERS
logging.level.org.springframework.security=DEBUG
api.security.token.secret =secret
spring.jpa.properties.org.hibernate.envers.global_with_modified_flags=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_auditoria
spring.jpa.properties.org.hibernate.envers.revision_field_sname=REVISION_ID
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=REVISION_TYPE
