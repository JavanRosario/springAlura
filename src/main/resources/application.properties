spring.application.name=springAlura
spring.jackson.mapper.accept-case-insensitive-properties=true

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=spring_alura
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.messages.encoding=UTF-8


springdoc.swagger-ui.path=/docs

springdoc.swagger-ui.operationsSorter=alpha

springdoc.show-actuator=false
springdoc.swagger-ui.default-model-rendering=model

urlOmdbApi=http://www.omdbapi.com/?t=%s&apikey=ead87646


