# ===================================================================
# CONFIGURACOES DA APLICACAO
# ===================================================================
spring.application.name=springAlura
spring.messages.encoding=UTF-8

# ===================================================================
# CONFIGURACOES DO BANCO DE DADOS (POSTGRESQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=spring_alura&charSet=UTF-8
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACOES DO JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURACOES DO JACKSON (SERIALIZACAO JSON)
# ===================================================================
spring.jackson.mapper.accept-case-insensitive-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# CONFIGURACOES DO SWAGGER UI (SPRINGDOC)
# ===================================================================
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.default-model-rendering=model
springdoc.show-actuator=false

# ===================================================================
# VARIAVEIS PERSONALIZADAS (APIS EXTERNAS)
# ===================================================================
urlOmdbApi=http://omdbapi.com
